# Service declarations for the NestQuest integration (Home Assistant
# services.yaml metadata). Services are domain-scoped: nested under the
# "nestquest" domain, not repeated per config entry.  Since Feature 18
# only the panel completion service remains — every admin operation
# moved to the PWA and the API service's admin routes.

complete_quest:
  name: Complete quest
  description: Mark a quest instance as completed.
  fields:
    instance_id:
      name: Instance ID
      description: The quest instance to complete.
      required: true
      selector:
        number:
          mode: box
    actor:
      name: Actor
      description: Who completed the quest (panel or user).
      required: true
      selector:
        select:
          options:
            - panel
            - user
    actor_child_id:
      name: Actor child ID
      description: The tapped child profile. Required when actor is panel.
      required: false
      selector:
        number:
          mode: box
    actor_user_id:
      name: Actor user ID
      description: Home Assistant user id when actor is user and no call context is present.
      required: false
      selector:
        text: